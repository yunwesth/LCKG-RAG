[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learningcommons-rag"
version = "0.1.0"
description = "Graph RAG over the Learning Commons Knowledge Graph (Neo4j) with a local Ollama LLM"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "neo4j>=5.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Each later phase adds its own extra, so modules stay independently installable.
orchestrator = ["fastapi>=0.111", "uvicorn>=0.30", "langgraph>=0.2", "langfuse>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["common*", "kg_tools*", "orchestrator*", "ingest*", "evals*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs running Neo4j/Ollama (deselect with -m 'not live')"]

[tool.ruff]
line-length = 100
